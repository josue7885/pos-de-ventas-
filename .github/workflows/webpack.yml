name: POS web resources
on:
  push:
    branches: [main, fix/backend-auth-sales-sync]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run prepare:web
      - name: Check prepared modules
        run: |
          node --check www/app.js
          node --check www/enhancements.js
          node --check www/pos-math.js
