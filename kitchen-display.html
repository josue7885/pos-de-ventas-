<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantalla de cocina</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --primary: #2563eb;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.2);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
        color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      body { padding: 20px; }
      .header {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 18px 22px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 18px;
      }
      .header h1 { margin: 0; font-size: clamp(26px, 2vw, 34px); }
      .status-bar {
        display: flex; gap: 10px; flex-wrap: wrap;
      }
      .chip {
        border-radius: 999px; padding: 8px 12px; background: rgba(37, 99, 235, 0.14); border: 1px solid rgba(96,165,250,0.3); color: #bfdbfe; font-weight: 700; font-size: 0.8rem;
      }
      .layout {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;
      }
      .section {
        background: rgba(17, 24, 39, 0.9); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-height: 210px;
      }
      .section h2 {
        margin: 0 0 12px; font-size: 1.1rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
      }
      .order-card {
        background: rgba(31, 41, 55, 0.95); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px;
      }
      .order-head {
        display: flex; justify-content: space-between; margin-bottom: 8px; gap: 8px;
      }
      .badge {
        border-radius: 999px; padding: 5px 9px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      }
      .badge.pending { background: rgba(245, 158, 11, 0.14); color: #fbbf24; }
      .badge.preparing { background: rgba(59, 130, 246, 0.14); color: #93c5fd; }
      .badge.ready { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; }
      .badge.served { background: rgba(168, 85, 247, 0.12); color: #d8b4fe; }
      .order-card h3 { margin: 0 0 6px; font-size: 1.2rem; }
      .meta { color: var(--muted); font-size: 0.85rem; margin: 4px 0; }
      .items { margin: 8px 0; padding-left: 18px; color: #e2e8f0; }
      .actions {
        display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
      }
      button {
        border: none; border-radius: 10px; padding: 9px 12px; font-weight: 700; cursor: pointer;
      }
      .secondary { background: #e2e8f0; color: #0f172a; }
      .primary { background: var(--primary); color: white; }
      .success { background: var(--success); color: white; }
      .warning { background: var(--warning); color: #111827; }
      .muted { background: rgba(148,163,184,0.12); color: #e2e8f0; }
      .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }
      @media (max-width: 700px) {
        body { padding: 12px; }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Pantalla de cocina</h1>
      </div>
      <div class="status-bar" id="quick-stats"></div>
    </header>

    <main class="layout">
      <section class="section">
        <h2>Pendientes</h2>
        <div id="pending-list"></div>
      </section>
      <section class="section">
        <h2>En preparación</h2>
        <div id="preparing-list"></div>
      </section>
      <section class="section">
        <h2>Listas</h2>
        <div id="ready-list"></div>
      </section>
    </main>

    <script src="app_utils.js"></script>
    <script src="display.js"></script>
  </body>
</html>
